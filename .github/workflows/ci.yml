name: CI

on:
  push:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx next lint

      - name: Prettier check
        run: npx prettier --check "**/*.{js,jsx,ts,tsx}"

      - name: Unit tests
        run: npm run test:unit

  acceptance-and-smoke:
    name: Acceptance & smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create lib/.env (Google OAuth disabled)
        run: |
          cat > lib/.env <<'EOF'
          SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED=false
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID=
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET=
          EOF

      - name: Start Supabase stack
        run: npm run supabase:start

      - name: Reset database
        run: npm run supabase:db:reset

      - name: Create .env.local from Supabase status
        run: |
          set -a
          eval "$(npx supabase status --workdir ./lib -o env)"
          set +a
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF

      - name: Start dev server
        run: |
          npm run dev > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Dev server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Dev server failed to start" >&2
          cat dev-server.log >&2
          exit 1

      - name: Acceptance tests
        run: npm run test:acceptance

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: dev-server.log
          if-no-files-found: ignore

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
