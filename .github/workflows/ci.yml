name: CI

on:
  push:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Prettier
        run: npm run prettier

      - name: Unit tests
        run: npm run test:unit

  acceptance-and-smoke:
    name: Acceptance & smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create lib/.env (Google OAuth disabled)
        run: |
          cat > lib/.env <<'EOF'
          SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED=false
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID=
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET=
          EOF

      # public.ecr.aws rate-limits anonymous pulls per IP, and GitHub-hosted
      # runners share IPs, so cold pulls fail intermittently. Cache the images
      # keyed on the CLI version (which pins the image tags) so only the first
      # run after a CLI bump touches the registry.
      - name: Get Supabase CLI version
        id: supabase-version
        run: echo "version=$(npx supabase --version)" >> "$GITHUB_OUTPUT"

      - name: Cache Supabase container images
        id: supabase-images
        uses: actions/cache@v4
        with:
          path: /tmp/supabase-images.tar
          key: supabase-images-${{ steps.supabase-version.outputs.version }}

      - name: Load Supabase images from cache
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/supabase-images.tar

      - name: Start Supabase stack
        run: npm run supabase:start

      - name: Export Supabase images for cache
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: docker save -o /tmp/supabase-images.tar $(docker images --format '{{.Repository}}:{{.Tag}}' --filter 'reference=public.ecr.aws/supabase/*')

      - name: Create .env.local from Supabase status
        run: |
          set -a
          eval "$(npx supabase status --workdir ./lib -o env)"
          set +a
          cat > .env.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$API_URL
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          EOF

      - name: Build production bundle
        run: npm run build

      - name: Start server
        run: |
          npm run start > dev-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start" >&2
          cat dev-server.log >&2
          exit 1

      - name: Acceptance tests
        run: npm run test:acceptance

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:smoke

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: dev-server.log
          if-no-files-found: ignore

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
